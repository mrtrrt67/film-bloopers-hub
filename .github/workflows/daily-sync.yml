name: Daily Sync Bloopers & Trivia

on:
  schedule:
    # Esegue ogni notte alle 03:00 UTC (04:00 ora italiana)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Cosa scansionare'
        required: true
        default: 'both'
        type: choice
        options:
          - 'both'
          - 'bloopers'
          - 'trivia'
      limit:
        description: 'Numero massimo di film da elaborare (0 = tutti i 326)'
        required: false
        default: '2'
      max_bloopers:
        description: 'Massimo bloopers nuovi per film'
        required: false
        default: '5'
      max_trivia:
        description: 'Massimo curiosità nuove per film'
        required: false
        default: '5'
      replace_trivia:
        description: 'Sostituisci progressivamente le vecchie curiosità generiche (Zero Downtime)'
        required: false
        default: 'false'
        type: boolean

jobs:
  daily-sync:
    name: Scansione Giornaliera Bloopers & Trivia
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Installa dipendenze
        run: npm ci --omit=dev

      - name: 🚀 Esegui Daily Sync
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SYNC_MODE: ${{ github.event.inputs.mode }}
          SYNC_LIMIT: ${{ github.event.inputs.limit }}
          MAX_BLOOPERS: ${{ github.event.inputs.max_bloopers }}
          MAX_TRIVIA: ${{ github.event.inputs.max_trivia }}
          REPLACE_TRIVIA: ${{ github.event.inputs.replace_trivia }}
          PAUSE_MS: '3000'
        run: node scripts/daily-sync.js
