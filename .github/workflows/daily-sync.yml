name: Daily Sync Bloopers & Trivia

on:
  schedule:
    # Esegue ogni notte alle 03:00 UTC (04:00 ora italiana) su PRODUZIONE
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      target_env:
        description: '🎯 Database Target (staging = Staging sicuro | production = Produzione live)'
        required: true
        default: 'staging'
        type: choice
        options:
          - 'staging'
          - 'production'
      mode:
        description: 'Cosa scansionare'
        required: true
        default: 'both'
        type: choice
        options:
          - 'both'
          - 'bloopers'
          - 'trivia'
      limit:
        description: 'Numero massimo di film da elaborare (0 = tutti i candidati prioritari)'
        required: false
        default: '0'
      max_bloopers:
        description: 'Massimo bloopers per passata (accumulativi fino a totale reale)'
        required: false
        default: '15'
      max_trivia:
        description: 'Massimo curiosità per passata (accumulativi fino a totale reale)'
        required: false
        default: '15'
      replace_trivia:
        description: 'Elimina le vecchie curiosità generiche/false per ciascun film (Zero Downtime)'
        required: false
        default: 'true'
        type: boolean
      force_all:
        description: 'Rielabora TUTTI i film a catalogo (nessuna esclusione di film sotto il target)'
        required: false
        default: 'true'
        type: boolean

jobs:
  daily-sync:
    name: Sync Bloopers & Trivia (${{ github.event.inputs.target_env || 'production' }})
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Installa dipendenze
        run: npm ci --omit=dev

      - name: 🚀 Esegui Daily Sync
        env:
          TARGET_ENV: ${{ github.event.inputs.target_env || 'production' }}
          # PRODUZIONE (gmiwhscbqvadnlqruhjs)
          PROD_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          PROD_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          PROD_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # STAGING (hktzscarmerpbgxgxliq)
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL || 'https://hktzscarmerpbgxgxliq.supabase.co' }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhrdHpzY2FybWVycGJneGd4bGlxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5MzE2MTcsImV4cCI6MjEwODUwNzYxN30.ufFb1-mVRGD0RU03gaeCghzdnRtbucCaU4LuBvymFZs' }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SYNC_MODE: ${{ github.event.inputs.mode || 'both' }}
          SYNC_LIMIT: ${{ github.event.inputs.limit || '0' }}
          MAX_BLOOPERS: ${{ github.event.inputs.max_bloopers || '10' }}
          MAX_TRIVIA: ${{ github.event.inputs.max_trivia || '10' }}
          REPLACE_TRIVIA: ${{ github.event.inputs.replace_trivia || 'true' }}
          FORCE_ALL: ${{ github.event.inputs.force_all || 'true' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PAUSE_MS: '350'
        run: node scripts/daily-sync.js
