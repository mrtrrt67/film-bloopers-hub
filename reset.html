<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Reindirizzamento Recupero Password - FilmBloopers Hub</title>
  <script>
    (function() {
      // Cattura query string (?code=...) e hash fragment (#access_token=...)
      var search = window.location.search || '';
      var hash = window.location.hash || '';
      var target = 'https://filmbloopers.online/auth/reset-password' + search + hash;
      window.location.replace(target);
    })();
  </script>
  <style>
    body { background: #0b0f19; color: #fff; font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .card { background: #18181b; padding: 2rem; border-radius: 1rem; border: 1px solid #27272a; text-align: center; max-width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h2 { margin-top: 0; color: #f59e0b; font-size: 1.25rem; }
    p { font-size: 0.875rem; color: #a1a1aa; line-height: 1.5; }
    a { color: #f59e0b; text-decoration: none; font-weight: bold; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Reindirizzamento in corso...</h2>
    <p>Ti stiamo trasferendo alla pagina sicura di reimpostazione password di FilmBloopers Hub.</p>
    <p><a href="https://filmbloopers.online/auth/reset-password">Clicca qui se non vieni reindirizzato automaticamente</a></p>
  </div>
</body>
</html>
